<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.webmanifest"><title>Gridiron Football V7</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#07111f;color:#f5f7fb}header{padding:18px 20px;background:#0d1829;border-bottom:1px solid #23334d;position:sticky;top:0}main{max-width:1050px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:#101d31;border:1px solid #263955;border-radius:16px;padding:16px;margin-bottom:14px}input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #354968;background:#091525;color:white;margin:5px 0}button{padding:11px 14px;border:0;border-radius:9px;background:#1769e0;color:white;font-weight:700;margin:4px 2px}button.secondary{background:#263955}.danger{background:#b72d3b}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#93a4bd}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#1b3150;color:#a9c9ff;font-size:12px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #263955;text-align:left}
</style></head><body><header><strong>🏈 Gridiron Football V7</strong><span id="status" class="muted" style="float:right"></span></header><main>
<section id="auth" class="card"><h2>Cloud Account</h2><p class="muted">Teams, seasons, rosters and games sync to the cloud.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="row"><button onclick="signup()">Create Account</button><button onclick="login()">Log In</button></div><p id="authMsg" class="muted"></p></section>
<section id="app" class="hidden"><div class="grid"><div class="card"><h2>Teams</h2><div id="teams"></div><input id="teamName" placeholder="New team name"><button onclick="addTeam()">Add Team</button></div><div class="card"><h2>Current Team</h2><div id="currentTeam" class="muted">Select a team</div><div id="seasonBox" class="hidden"><h3>Seasons</h3><div id="seasons"></div><input id="seasonYear" type="number" placeholder="2026"><button onclick="addSeason()">Start New Season</button></div></div></div>
<div id="workspace" class="hidden"><div class="card"><div class="row"><h2 style="margin-right:auto">Season Dashboard</h2><button class="secondary" onclick="loadPlayers()">Roster</button><button class="secondary" onclick="loadGames()">Games</button><button class="danger" onclick="logout()">Log Out</button></div><div id="dashboard"></div></div>
<div class="grid"><div class="card"><h3>Add Player</h3><input id="pf" placeholder="First name"><input id="pl" placeholder="Last name"><input id="pn" placeholder="Jersey #"><input id="pp" placeholder="Position"><input id="pc" placeholder="Class"><input id="ph" placeholder="Height"><input id="pw" placeholder="Weight"><input id="pt" placeholder="Hometown"><button onclick="addPlayer()">Add to Roster</button></div>
<div class="card"><h3>Add Game</h3><input id="opp" placeholder="Opponent"><input id="gdate" type="date"><select id="gtype"><option value="regular">Regular Season</option><option value="conference_championship">Conference Championship</option><option value="bowl">Bowl</option><option value="playoff">Playoff</option><option value="national_championship">National Championship</option></select><div class="row"><input id="ts" type="number" placeholder="Team score" value="0"><input id="os" type="number" placeholder="Opponent score" value="0"></div><button onclick="addGame()">Add Game</button></div></div>
<div class="card"><h3>Roster / Game Log</h3><div id="content"></div></div></div></section></main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb=createClient("https://cbnfszbtjrepqlrgakuh.supabase.co","sb_publishable_pMo5Mc8BdqaKYZlb5i1fsg_vHJtTp6I");
let user=null,currentTeam=null,currentSeason=null,players=[],games=[];const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
async function init(){const r=await sb.auth.getSession();user=r.data.session?.user||null;render();if(user)loadTeams()}
function render(){$("auth").classList.toggle("hidden",!!user);$("app").classList.toggle("hidden",!user);$("status").textContent=user?user.email:"Not signed in"}
window.signup=async()=>{const r=await sb.auth.signUp({email:$("email").value,password:$("password").value});$("authMsg").textContent=r.error?.message||"Account created. Check your email if confirmation is required."}
window.login=async()=>{const r=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(r.error)return $("authMsg").textContent=r.error.message;user=r.data.user;render();loadTeams()}
window.logout=async()=>{await sb.auth.signOut();user=null;currentTeam=currentSeason=null;render()}
async function loadTeams(){const r=await sb.from("teams").select("*").order("created_at");if(r.error)return alert(r.error.message);$("teams").innerHTML=(r.data||[]).map(t=>`<button class="secondary" onclick="selectTeam('${t.id}')">${esc(t.name)}</button>`).join("")||'<p class="muted">No teams yet.</p>'}
window.addTeam=async()=>{const name=$("teamName").value.trim();if(!name)return;const r=await sb.from("teams").insert({owner_id:user.id,name}).select().single();if(r.error)return alert(r.error.message);$("teamName").value="";await loadTeams();selectTeam(r.data.id)}
window.selectTeam=async id=>{const r=await sb.from("teams").select("*").eq("id",id).single();if(r.error)return alert(r.error.message);currentTeam=r.data;$("currentTeam").innerHTML="<b>"+esc(r.data.name)+"</b>";$("seasonBox").classList.remove("hidden");const s=await sb.from("seasons").select("*").eq("team_id",id).order("year",{ascending:false});$("seasons").innerHTML=(s.data||[]).map(x=>`<button class="secondary" onclick="selectSeason('${x.id}')">${x.year}</button>`).join("")||'<p class="muted">No seasons yet.</p>'}
window.addSeason=async()=>{const year=Number($("seasonYear").value);if(!year||!currentTeam)return;const r=await sb.from("seasons").insert({team_id:currentTeam.id,year,label:String(year)}).select().single();if(r.error)return alert(r.error.message);await selectTeam(currentTeam.id);selectSeason(r.data.id)}
window.selectSeason=async id=>{const r=await sb.from("seasons").select("*").eq("id",id).single();if(r.error)return alert(r.error.message);currentSeason=r.data;$("workspace").classList.remove("hidden");await loadPlayers();await loadGames();renderDashboard()}
window.loadPlayers=async()=>{const r=await sb.from("roster_entries").select("player_id,players(*)").eq("season_id",currentSeason.id);players=(r.data||[]).map(x=>x.players);$("content").innerHTML=players.map(p=>`<div class="row"><span class="badge">#${esc(p.jersey_number)}</span><b>${esc(p.first_name)} ${esc(p.last_name)}</b><span class="muted">${esc(p.position)}</span></div>`).join("")||'<p class="muted">Roster is empty.</p>'}
window.addPlayer=async()=>{if(!currentTeam||!currentSeason)return alert("Select a team and season first.");const p={team_id:currentTeam.id,first_name:$("pf").value.trim(),last_name:$("pl").value.trim(),jersey_number:$("pn").value.trim(),position:$("pp").value.trim(),class_year:$("pc").value.trim(),height:$("ph").value.trim(),weight:$("pw").value.trim(),hometown:$("pt").value.trim()};if(!p.first_name||!p.last_name)return;const r=await sb.from("players").insert(p).select().single();if(r.error)return alert(r.error.message);const rr=await sb.from("roster_entries").insert({season_id:currentSeason.id,player_id:r.data.id});if(rr.error)return alert(rr.error.message);document.querySelectorAll("#pf,#pl,#pn,#pp,#pc,#ph,#pw,#pt").forEach(x=>x.value="");loadPlayers()}
window.addGame=async()=>{if(!currentSeason)return;const g={season_id:currentSeason.id,opponent:$("opp").value.trim(),game_date:$("gdate").value||null,game_type:$("gtype").value,team_score:Number($("ts").value)||0,opponent_score:Number($("os").value)||0,status:"final"};if(!g.opponent)return;const r=await sb.from("games").insert(g).select().single();if(r.error)return alert(r.error.message);$("opp").value="";loadGames();renderDashboard()}
window.loadGames=async()=>{const r=await sb.from("games").select("*").eq("season_id",currentSeason.id).order("game_date");games=r.data||[];const rows=games.map(g=>`<tr><td>${esc(g.game_date)}</td><td>${esc(g.opponent)}</td><td>${esc(g.game_type)}</td><td>${g.team_score}-${g.opponent_score}</td></tr>`).join("");$("content").innerHTML=rows?`<table><tr><th>Date</th><th>Opponent</th><th>Type</th><th>Score</th></tr>${rows}</table>`:'<p class="muted">No games yet.</p>'}
function renderDashboard(){const w=games.filter(g=>g.team_score>g.opponent_score).length,l=games.filter(g=>g.team_score<g.opponent_score).length;$("dashboard").innerHTML=`<span class="badge">${currentSeason.year}</span> <b>${games.length} games</b> · ${w} wins · ${l} losses · ${players.length} rostered players`}
sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;render();if(user)loadTeams()});init();
</script></body></html>
